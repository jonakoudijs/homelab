---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slskd
  labels:
    app: slskd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slskd
  template:
    metadata:
      labels:
        app: slskd
    spec:
      containers:
        - name: slskd
          image: docker.io/slskd/slskd:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5030
            - containerPort: 5031
            - containerPort: 50300
          env:
            - name: SLSKD_REMOTE_CONFIGURATION
              value: "true"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - mountPath: /app
              name: slskd-data
      volumes:
        - name: slskd-data
          persistentVolumeClaim:
            claimName: slskd-data
