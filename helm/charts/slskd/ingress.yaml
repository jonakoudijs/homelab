---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: slskd
spec:
  rules:
    - host: soulseek.koudijs.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: slskd
                port:
                  number: 5030
  tls:
    - secretName: soulseek-koudijs-lan
      hosts:
        - soulseek.koudijs.lan
