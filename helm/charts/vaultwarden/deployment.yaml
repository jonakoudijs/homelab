---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  labels:
    app: vaultwarden
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      containers:
        - name: vaultwarden
          image: vaultwarden/server:latest
          imagePullPolicy: Always
          env:
            - name: DOMAIN
              value: "https://vault.koudijs.lan"
            # - name: DATABASE_URL
            #   value: postgresql://[[user]:[password]@]host[:port][/database]
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-db-credentials
                  key: host
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-db-credentials
                  key: database
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-db-credentials
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-db-credentials
                  key: username
          ports:
            - containerPort: 80
          volumeMounts:
            - mountPath: /data
              name: vaultwarden-data
      volumes:
        - name: vaultwarden-data
          persistentVolumeClaim:
            claimName: vaultwarden-data
