apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-cluster-apps
spec:
  instances: 3
  storage:
    storageClass: longhorn-single-replica
    size: 2Gi
  managed:
    roles:
      - name: nextcloud-user
        ensure: present
        login: true
        passwordSecret:
          name: nextcloud-db-credentials
