---
helmDefaults:
  kubeContext: homelab

hooks:
  - events: ["prepare"]
    showlogs: true
    command: "kubectl"
    args:
      - "config"
      - "set-context"
      - "--current"
      - "--namespace=kube-system"

repositories:
  - name: metrics-server
    url: https://kubernetes-sigs.github.io/metrics-server/
  - name: metallb
    url: https://metallb.github.io/metallb
  - name: traefik
    url: https://traefik.github.io/charts
  - name: sealed-secrets
    url: https://bitnami.github.io/sealed-secrets
  - name: longhorn
    url: https://charts.longhorn.io
  - name: jetstack
    url: https://charts.jetstack.io
  - name: smallstep
    url: https://smallstep.github.io/helm-charts/
  - name: traefik
    url: https://traefik.github.io/charts
  - name: keel
    url: https://charts.keel.sh
  - name: cnpg
    url: https://cloudnative-pg.github.io/charts
  - name: jellyfin
    url: https://jellyfin.github.io/jellyfin-helm
  - name: nextcloud
    url: https://nextcloud.github.io/helm/

releases:
  ## system
  - name: metrics-server
    namespace: kube-system
    chart: metrics-server/metrics-server
    values:
      - defaultArgs:
          - --cert-dir=/tmp
          - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
          - --kubelet-insecure-tls=true
          - --kubelet-use-node-status-port
          - --metric-resolution=15s
  - name: metallb
    namespace: kube-system
    chart: metallb/metallb
  - name: sealed-secrets
    namespace: kube-system
    chart: sealed-secrets/sealed-secrets
    set:
      - name: fullnameOverride
        value: sealed-secrets-controller

  ## ingress
  - name: traefik-gateway-crd
    namespace: kube-ingress
    createNamespace: true
    chart: config/traefik

  ## storage
  - name: longhorn
    namespace: kube-system
    chart: longhorn/longhorn
    values:
      - global:
          timezone: "Europe/Amsterdam"

  ## cnpg
  - name: cnpg
    chart: cnpg/cloudnative-pg
    namespace: cnpg-system
    createNamespace: true

  ## certificates
  - name: cert-manager
    namespace: kube-system
    chart: jetstack/cert-manager
    set:
      - name: crds.enabled
        value: true
  - name: step-certificates
    namespace: kube-system
    chart: smallstep/step-certificates
  - name: step-issuer
    namespace: kube-system
    chart: smallstep/step-issuer
    values:
      - certManager:
          serviceAccount:
            name: cert-manager
            namespace: kube-system
