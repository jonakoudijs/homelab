---
helmDefaults:
  kubeContext: homelab

hooks:
  - events: ["prepare"]
    showlogs: true
    command: "kubectl"
    args:
      - "config"
      - "set-context"
      - "--current"
      - "--namespace=kube-system"

releases:
  ## apps
  - name: apps-namespace
    chart: charts/apps-namespace
  - name: test-app
    chart: charts/test-app
    namespace: apps
  - name: unifi
    chart: charts/unifi
    namespace: apps
  - name: fusion-rss
    chart: charts/fusion
    namespace: apps
  - name: monochrome
    chart: charts/monochrome
    namespace: apps
  - name: karakeep
    chart: charts/karakeep
    namespace: apps

  ## homepage
  - name: metallb-config
    namespace: apps
    chart: config/homepage
  - name: homepage
    chart: jameswynn/homepage
    namespace: apps
    values:
      - env:
        - name: HOMEPAGE_ALLOWED_HOSTS
          value: koudijs.lan
      - enableRbac: true
      - ingress:
          main:
            enabled: true
            hosts:
              - host: koudijs.lan
                paths:
                  - path: /
                    pathType: Prefix
            tls:
              - secretName: koudijs-lan
                hosts:
                  - koudijs.lan
      - config:
          widgets:
            - resources:
                backend: kubernetes
                expanded: true
                cpu: true
                memory: true
            - search:
                provider: duckduckgo
                target: _blank
            - kubernetes:
                cluster:
                  show: false
                  # cpu: true
                  # memory: true
                  # showLabel: true
                  # label: "cluster"
                nodes:
                  show: true
                  cpu: true
                  memory: true
                  showLabel: true
          kubernetes:
            mode: cluster
            gateway: true

  ## system
  - name: metallb-config
    namespace: kube-system
    chart: config/metallb

  ## ingress
  - name: traefik
    namespace: kube-system
    chart: traefik/traefik
    values:
      - ingressClass:
          enabled: true
      - api:
          dashboard: false
      - providers:
          kubernetesCRD:
            allowCrossNamespace: true
            allowExternalNameServices: true
          kubernetesIngress:
            allowExternalNameServices: true
            enabled: true
          kubernetesGateway:
            enabled: true
      - gateway:
          listeners:
            web:
              namespacePolicy:
                from: All
      - service:
          annotations:
            service.beta.kubernetes.io/metal-lb: "true"
            metallb.universe.tf/address-pool: default-pool

  ## certificates
  - name: issuers
    namespace: kube-system
    chart: config/issuers
