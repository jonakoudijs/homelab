---
helmDefaults:
  kubeContext: homelab

hooks:
  - events: ["prepare"]
    showlogs: true
    command: "kubectl"
    args:
      - "config"
      - "set-context"
      - "--current"
      - "--namespace=kube-system"

releases:
  ## apps
  - name: apps-namespace
    chart: charts/apps-namespace
  - name: test-app
    chart: charts/test-app
    namespace: apps
  - name: unifi
    chart: charts/unifi
    namespace: apps
  - name: fusion-rss
    chart: charts/fusion
    namespace: apps
  - name: monochrome
    chart: charts/monochrome
    namespace: apps
  - name: karakeep
    chart: charts/karakeep
    namespace: apps
  # - name: grimmory
  #   chart: charts/grimmory
  #   namespace: apps
  - name: navidrome
    chart: charts/navidrome
    namespace: apps

  ## system
  - name: metallb-config
    namespace: kube-system
    chart: config/metallb
  - name: longhorn-config
    namespace: kube-system
    chart: config/longhorn
  - name: keel
    namespace: kube-system
    chart: keel/keel
    values:
      - service:
          enabled: true
          type: ClusterIP
          externalPort: 9300
          #clusterIP: ""
      - basicauth:
          enabled: true
          user: "jona"
          password: "sahnop-6boqna-joQtik"
      - ingress:
          enabled: true
          hosts:
            - host: keel.koudijs.lan
              paths:
                - /
          tls:
            - secretName: keel-koudijs-lan
              hosts:
                - keel.koudijs.lan
  - name: keel-config
    namespace: kube-system
    chart: config/keel
  - name: samba-server
    namespace: apps
    chart: charts/samba

  ## ingress
  - name: traefik
    namespace: kube-system
    chart: traefik/traefik
    values:
      - ingressClass:
          enabled: true
      - api:
          dashboard: false
      - providers:
          kubernetesCRD:
            allowCrossNamespace: true
            allowExternalNameServices: true
          kubernetesIngress:
            allowExternalNameServices: true
            enabled: true
          kubernetesGateway:
            enabled: true
      - gateway:
          listeners:
            web:
              namespacePolicy:
                from: All
      - service:
          annotations:
            service.beta.kubernetes.io/metal-lb: "true"
            metallb.universe.tf/address-pool: default-pool

  ## certificates
  - name: issuers
    namespace: kube-system
    chart: config/issuers
